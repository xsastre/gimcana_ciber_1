name: Build i Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Instal·lar dependències
        run: npm ci
      
      - name: Build de producció
        run: npm run build
      
      - name: Verificar build
        run: |
          if [ ! -d "dist/gimcana-app/browser" ]; then
            echo "Error: Build no s'ha generat correctament"
            exit 1
          fi
          echo "Build completat amb èxit!"
          du -sh dist/gimcana-app/browser
      
      - name: Pujar artefactes de build
        uses: actions/upload-artifact@v4
        with:
          name: gimcana-app-build
          path: dist/gimcana-app/browser
          retention-days: 7
  
